# Keeps the county pack fresh without a server: events every hour, places once a week.
# It commits only when a source actually changed.
name: Refresh county data
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '41 8 * * 1'
  workflow_dispatch:
    inputs:
      places:
        description: Rebuild the places too
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build
        run: |
          if [ "${{ github.event.schedule }}" = "41 8 * * 1" ] || [ "${{ inputs.places }}" = "true" ]; then
            python3 tools/build_pack.py || true
          else
            python3 tools/build_pack.py --events || true
          fi
      - name: Commit if a source changed
        run: |
          git config user.name "daylight-data"
          git config user.email "daylight-data@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Refresh county data"
          git pull --rebase origin main
          git push origin HEAD:main
