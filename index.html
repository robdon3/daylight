<!doctype html>
<html lang="en" data-theme="dark" data-phase="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daylight</title>
<meta name="description" content="A companion for where you live: the places, the people and what's happening, on one map.">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <header id="sky"></header>
  <main id="view"></main>
  <div id="mapwrap" hidden>
    <div id="maptop">
      <input id="search" type="search" placeholder="Search places: parks, clubs, coffee…" autocomplete="off" enterkeyhint="search" aria-label="Search places">
      <div id="chips"></div>
    </div>
    <div id="map"></div>
    <ol id="deck"></ol>
    <button id="locate" data-act="locate" aria-label="Show where I am">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>
  <nav id="tabs">
    <button data-act="tab" data-tab="map" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span>Explore</span>
    </button>
    <button data-act="tab" data-tab="paper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12v15a1.500 1.500 0 0 0 3 0V8h-3"/><path d="M5 4v15a2 2 0 0 0 2 2h11.500"/><path d="M8.500 8h5M8.500 12h5M8.500 16h5"/></svg>
      <span>Paper</span>
    </button>
    <button data-act="tab" data-tab="events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>
      <span>Happening</span>
    </button>
    <button data-act="tab" data-tab="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.6 13.6 8.5 15.5 10.4 10.4z"/></svg>
      <span>Guide</span>
    </button>
    <button data-act="tab" data-tab="mine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.400 1.800 6 5"/><circle cx="17" cy="10" r="2.4"/><path d="M16.500 14.600c2.400.200 4 1.700 4.500 4.400"/></svg>
      <span>Mine</span>
    </button>
  </nav>
</div>
<div id="backdrop" data-act="close-sheet" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<script src="app.js?v=5" defer></script>
</body>
</html>
